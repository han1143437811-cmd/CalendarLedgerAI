name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Business and bridge tests
        run: node --test prototype/tests/*.test.mjs
      - name: Native calendar dates and recurrence
        run: |
          mkdir -p "$RUNNER_TEMP/calendar-date-tests"
          javac --release 8 -d "$RUNNER_TEMP/calendar-date-tests" android/src/org/calendarledger/preview/CalendarMonth.java android/src/org/calendarledger/preview/ReminderDates.java android/tests/CalendarMonthTest.java android/tests/ReminderDatesTest.java
          java -cp "$RUNNER_TEMP/calendar-date-tests" CalendarMonthTest
          java -cp "$RUNNER_TEMP/calendar-date-tests" ReminderDatesTest
